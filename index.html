<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website — Ufaaa 🌸</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Latar Belakang Berlapis -->
    <div class="bg-layer-1"></div>
    <div class="bg-layer-2"></div>
    <div class="bg-glow"></div>

    <header>
        <nav class="navbar">
            <div class="nav-container">
                <!-- Logo -->
                <div class="logo">
                    <span class="logo-icon">🌸</span>
                    <h1>Ufaaa</h1>
                </div>

                <!-- Menu Navigasi -->
                <ul class="nav-links">
                    <li><a href="#" class="nav-link">
                        <span>Beranda</span>
                        <span class="link-line"></span>
                    </a></li>
                    <li><a href="#" class="nav-link">
                        <span>Tentang</span>
                        <span class="link-line"></span>
                    </a></li>
                    <li><a href="#" class="nav-link">
                        <span>Layanan</span>
                        <span class="link-line"></span>
                    </a></li>
                    <li><a href="#" class="nav-link">
                        <span>Kontak</span>
                        <span class="link-line"></span>
                    </a></li>
                </ul>

                <!-- Tombol Aksi -->
                <div class="nav-cta">
                    <a href="#" class="btn-primary">Mulai</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <div class="badge">
                    <span class="badge-dot"></span>
                    <span>Pencarian 🌸</span>
                </div>
                
                <h1 class="hero-title">
                    <span class="title-line">Berlatih Membuat</span>
                    <span class="title-gradient">Navigation Bar</span>
                </h1>
                
                <p class="hero-desc">
                    Navigation bar ini dibuat menggunakan HTML dan CSS 🌷
                </p>

                <div class="hero-divider">
                    <span class="divider-dot"></span>
                    <span class="divider-line"></span>
                    <span class="divider-dot"></span>
                </div>

                <div class="hero-buttons">
                    <a href="#" class="btn-primary btn-lg">Jelajahi</a>
                    <a href="#" class="btn-secondary btn-lg">Pelajari</a>
                </div>
            </div>

            <!-- Elemen Hiasan Bunga -->
            <div class="deco-circle-1"></div>
            <div class="deco-circle-2"></div>
            <div class="deco-blob"></div>
        </section>
    </main>
</body>
</html>
